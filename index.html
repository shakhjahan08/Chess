<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Royal Online Chess</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg: #161512;
      --panel: #262421;
      --panel-border: #363431;
      --text: #bababa;
      --light-square: #ebedd0;
      --dark-square: #779952;
      --highlight: rgba(255, 255, 0, 0.4);
      --last-move: rgba(155, 199, 0, 0.41);
      --green-btn: #81b64c;
      --green-btn-hover: #a3d168;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--bg);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 100%;
      max-width: 1100px;
      padding: 16px;
      display: grid;
      grid-template-columns: minmax(320px, 680px) 340px;
      gap: 24px;
    }

    /* Board Area */
    .board-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      background: #000;
      border-radius: 4px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      user-select: none;
    }

    .board-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      width: 100%;
      height: 100%;
      border-radius: 4px;
      overflow: hidden;
    }

    .square {
      position: relative;
      border: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .square.light { background-color: var(--light-square); }
    .square.dark { background-color: var(--dark-square); }

    .square.selected::after {
      content: "";
      position: absolute;
      inset: 0;
      background-color: var(--highlight);
    }

    .square.last-move::after {
      content: "";
      position: absolute;
      inset: 0;
      background-color: var(--last-move);
    }

    .square.legal-move::before {
      content: "";
      width: 28%;
      height: 28%;
      background: rgba(0, 0, 0, 0.15);
      border-radius: 50%;
      z-index: 2;
    }

    /* Piece Container & Smooth Slide Animation */
    .piece-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .piece {
      position: absolute;
      width: 12.5%;
      height: 12.5%;
      display: grid;
      place-items: center;
      font-size: clamp(2rem, 8vw, 4.2rem);
      line-height: 1;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
      transition: transform 0.18s cubic-bezier(0.2, 0, 0.2, 1);
      will-change: transform;
      z-index: 5;
    }

    /* UI Panel */
    .panel {
      background: var(--panel);
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      border: 1px solid var(--panel-border);
    }

    h2 { margin: 0; font-size: 1.4rem; color: #fff; }
    p { margin: 0; color: var(--text); font-size: 0.95rem; }

    .status-bar {
      background: rgba(0,0,0,0.2);
      padding: 12px;
      border-radius: 6px;
      text-align: center;
      font-weight: 600;
      color: #fff;
      border: 1px solid var(--panel-border);
    }

    .room-box {
      background: #191816;
      border: 1px solid var(--panel-border);
      padding: 12px;
      border-radius: 6px;
      text-align: center;
    }

    .room-id {
      font-family: monospace;
      font-size: 2rem;
      letter-spacing: 4px;
      color: #f1c66b;
      margin-top: 4px;
    }

    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; }

    input, button {
      font: inherit;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid var(--panel-border);
      outline: none;
    }

    input {
      background: #191816;
      color: #fff;
      text-align: center;
      font-weight: bold;
      letter-spacing: 2px;
    }

    button {
      cursor: pointer;
      font-weight: bold;
      color: #fff;
      background: #363431;
      transition: background 0.2s;
    }

    button:hover { background: #45433f; }

    button.primary {
      background: var(--green-btn);
      border: 0;
    }

    button.primary:hover { background: var(--green-btn-hover); }

    .player-card {
      background: #191816;
      padding: 10px 14px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--panel-border);
    }

    .turn-indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #45433f;
    }

    .turn-indicator.active { background: #81b64c; box-shadow: 0 0 8px #81b64c; }

    @media (max-width: 800px) {
      .app { grid-template-columns: 1fr; padding: 10px; }
    }
  </style>
</head>
<body>

<main class="app">
  <div class="board-container">
    <div id="boardGrid" class="board-grid"></div>
    <div id="pieceLayer" class="piece-layer"></div>
  </div>

  <aside class="panel">
    <h2>♟️ Chess Online</h2>
    <div id="status" class="status-bar">Create or Join a Room</div>

    <div class="room-box">
      <span style="font-size: 0.8rem; color: var(--text);">ONLINE ROOM ID</span>
      <div id="roomDisplay" class="room-id">------</div>
    </div>

    <div class="row">
      <input id="roomInput" inputmode="numeric" maxlength="6" placeholder="6-Digit ID">
      <button id="joinBtn">Join</button>
    </div>

    <button id="createBtn" class="primary">Create 6-Digit Room</button>
    <button id="leaveBtn" style="opacity: 0.7;">Leave Room</button>

    <div class="player-card">
      <div>
        <small style="color: var(--text); display: block;">YOU</small>
        <strong id="mySide">Not connected</strong>
      </div>
      <div id="myTurnDot" class="turn-indicator"></div>
    </div>

    <div class="player-card">
      <div>
        <small style="color: var(--text); display: block;">OPPONENT</small>
        <strong id="oppSide">Waiting...</strong>
      </div>
      <div id="oppTurnDot" class="turn-indicator"></div>
    </div>
  </aside>
</main>

<script>
(() => {
  'use strict';

  const $ = id => document.getElementById(id);
  const files = 'abcdefgh';
  const symbols = {
    w: { p: '♙', r: '♖', n: '♘', b: '♗', q: '♕', k: '♔' },
    b: { p: '♟', r: '♜', n: '♞', b: '♝', q: '♛', k: '♚' }
  };

  const state = {
    chess: new Chess(),
    peer: null,
    conn: null,
    room: null,
    host: false,
    color: null,
    selected: null,
    lastMove: null
  };

  // Audio effects using Web Audio API Synth
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'move') {
      osc.frequency.setValueAtTime(320, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
      osc.start(); osc.stop(audioCtx.currentTime + 0.08);
    } else if (type === 'capture') {
      osc.frequency.setValueAtTime(180, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
      osc.start(); osc.stop(audioCtx.currentTime + 0.12);
    }
  }

  const opposite = c => c === 'w' ? 'b' : 'w';

  function renderBoardSquares() {
    const grid = $('boardGrid');
    grid.innerHTML = '';
    const isBlack = state.color === 'b';
    const rows = isBlack ? [0,1,2,3,4,5,6,7] : [7,6,5,4,3,2,1,0];
    const cols = isBlack ? [7,6,5,4,3,2,1,0] : [0,1,2,3,4,5,6,7];

    rows.forEach(r => {
      cols.forEach(c => {
        const sq = files[c] + (r + 1);
        const btn = document.createElement('button');
        btn.className = `square ${(r + c) % 2 === 0 ? 'dark' : 'light'}`;
        btn.dataset.sq = sq;

        if (state.selected === sq) btn.classList.add('selected');
        if (state.lastMove && (state.lastMove.from === sq || state.lastMove.to === sq)) {
          btn.classList.add('last-move');
        }

        if (state.selected && state.chess.moves({ square: state.selected, verbose: true }).some(m => m.to === sq)) {
          btn.classList.add('legal-move');
        }

        btn.onclick = () => onSquareClick(sq);
        grid.appendChild(btn);
      });
    });
  }

  function renderPieces() {
    const layer = $('pieceLayer');
    layer.innerHTML = '';
    const board = state.chess.board();
    const isBlack = state.color === 'b';

    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        const piece = board[r][c];
        if (!piece) continue;

        const sq = files[c] + (8 - r);
        const el = document.createElement('div');
        el.className = 'piece';
        el.textContent = symbols[piece.color][piece.type];

        // Animated Position Calculation
        const displayCol = isBlack ? 7 - c : c;
        const displayRow = isBlack ? r : 7 - r;

        el.style.transform = `translate(${displayCol * 100}%, ${displayRow * 100}%)`;
        layer.appendChild(el);
      }
    }
  }

  function updateUI() {
    renderBoardSquares();
    renderPieces();

    $('roomDisplay').textContent = state.room \vert{}\vert{} '------';$('mySide').textContent = state.color ? (state.color === 'w' ? 'White' : 'Black') : 'Waiting...';
    $('oppSide').textContent = state.color ? (state.color === 'w' ? 'Black' : 'White') : 'Waiting...';

    const myTurn = state.color && state.chess.turn() === state.color;
    $('myTurnDot').className = `turn-indicator ${myTurn ? 'active' : ''}`;
    $('oppTurnDot').className = `turn-indicator ${state.color && !myTurn ? 'active' : ''}`;

    if (!state.conn) $('status').textContent = 'Create or join a 6-digit room';
    else if (!state.color) $('status').textContent = 'Connecting with opponent...';
    else if (state.chess.is_checkmate()) $('status').textContent = 'Checkmate!';
    else if (state.chess.is_draw()) $('status').textContent = 'Draw!';
    else $('status').textContent = myTurn ? 'Your Turn' : "Opponent's Turn";
  }

  function executeMove(moveObj, emit = false) {
    const captured = state.chess.get(moveObj.to);
    const result = state.chess.move(moveObj);
    if (!result) return false;

    state.lastMove = { from: result.from, to: result.to };
    playSound(captured ? 'capture' : 'move');

    if (emit && state.conn?.open) {
      state.conn.send({ type: 'move', move: moveObj });
    }

    state.selected = null;
    updateUI();
    return true;
  }

  function onSquareClick(sq) {
    if (!state.conn?.open || !state.color || state.chess.turn() !== state.color || state.chess.game_over()) return;

    const piece = state.chess.get(sq);

    if (state.selected) {
      const legal = state.chess.moves({ square: state.selected, verbose: true }).find(m => m.to === sq);
      if (legal) {
        executeMove({ from: state.selected, to: sq, promotion: 'q' }, true);
        return;
      }
      state.selected = piece?.color === state.color ? sq : null;
    } else if (piece?.color === state.color) {
      state.selected = sq;
    }
    updateUI();
  }

  function connectToPeer(connection) {
    state.conn = connection;

    connection.on('open', () => {
      if (state.host) {
        state.conn.send({ type: 'init', color: opposite(state.color) });
      }
      updateUI();
    });

    connection.on('data', data => {
      if (data.type === 'init' && !state.host) {
        state.color = data.color;
        state.chess.reset();
        updateUI();
      } else if (data.type === 'move') {
        executeMove(data.move, false);
      }
    });

    connection.on('close', () => {
      state.conn = null;
      $('status').textContent = 'Opponent Disconnected';
      updateUI();
    });
  }

  function startRoom(roomId, isHost) {
    if (state.peer) state.peer.destroy();

    state.room = roomId;
    state.host = isHost;
    state.color = isHost ? (Math.random() < 0.5 ? 'w' : 'b') : null;
    state.chess.reset();
    state.lastMove = null;

    // Use pure 6-digit ID over PeerJS network
    state.peer = new Peer(`royal-chess-${roomId}`);

    state.peer.on('open', () => {
      if (!isHost) {
        const connection = state.peer.connect(`royal-chess-${roomId}`, { reliable: true });
        connectToPeer(connection);
      }
      updateUI();
    });

    if (isHost) {
      state.peer.on('connection', connectToPeer);
    }

    state.peer.on('error', err => {
      alert('Room Connection Error: ' + err.type);
    });
  }

  // Generate 6-digit numeric room code
  $('createBtn').onclick = () => {
    const code = Math.floor(100000 + Math.random() * 900000).toString();
    startRoom(code, true);
  };

  $('joinBtn').onclick = () => {
    const code = $('roomInput').value.trim();
    if (code.length !== 6) return alert('Enter a valid 6-digit Room ID');
    startRoom(code, false);
  };

  $('leaveBtn').onclick = () => {
    if (state.peer) state.peer.destroy();
    state.conn = null;
    state.room = null;
    state.color = null;
    state.chess.reset();
    updateUI();
  };

  updateUI();
})();
</script>

</body>
</html>

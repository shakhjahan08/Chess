<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Royal Chess Online</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    :root{--bg:#07131f;--panel:#122438;--line:#304961;--text:#eef7ff;--muted:#9db2c7;--blue:#62baff;--light:#ead6b0;--dark:#718e6b}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% -10%,#24527c,#0b2033 38%,var(--bg) 76%);color:var(--text);font-family:system-ui,Arial,sans-serif}.app{max-width:1050px;margin:auto;padding:24px 16px 40px}h1{margin:10px 0 4px}p{color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(300px,700px) 280px;gap:18px;align-items:start}.panel{background:#ffffff08;border:1px solid var(--line);border-radius:16px;padding:16px}.board{width:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);border:6px solid #1b3046;border-radius:12px;overflow:hidden}.square{border:0;display:grid;place-items:center;padding:0;font-size:clamp(1.7rem,7vw,4.5rem);cursor:pointer}.light{background:var(--light)}.dark{background:var(--dark)}.selected{box-shadow:inset 0 0 0 5px var(--blue)}.legal:after{content:"";width:20%;height:20%;border-radius:50%;background:#58d78caa}.piece{line-height:1;filter:drop-shadow(0 3px 2px #0008);user-select:none}.row{display:flex;gap:8px;margin:10px 0}.row>*{min-width:0;flex:1}.btn,input{font:inherit;border:1px solid var(--line);border-radius:9px;padding:10px;background:#ffffff0d;color:var(--text)}.btn{cursor:pointer;font-weight:700}.btn.primary{background:linear-gradient(135deg,#62baff,#3d62ed);border:0}.btn:disabled{opacity:.5;cursor:not-allowed}.room{font-size:1.35rem;letter-spacing:.12em;color:#f1c66b;word-break:break-all}.status{padding:11px;border-radius:10px;background:#ffffff0a;color:var(--muted);text-align:center;margin-top:12px}.player{padding:10px;border:1px solid #ffffff14;border-radius:10px;margin:8px 0}.label{display:block;color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.1em}.you{color:#f1c66b;float:right}@media(max-width:800px){.layout{grid-template-columns:1fr}.app{padding:12px 10px 28px}}
  </style>
</head>
<body>
  <main class="app">
    <h1>♞ Royal Chess Online</h1>
    <p>Connect to a private room and play chess in real time.</p>
    <div class="layout">
      <section class="panel"><div id="board" class="board" aria-label="Chess board"></div><div id="status" class="status">Create or join a room to start</div></section>
      <aside class="panel">
        <span class="label">Room ID</span><div id="roomDisplay" class="room">Not connected</div>
        <div class="row"><input id="roomInput" inputmode="numeric" maxlength="6" placeholder="6-digit room ID"><button id="createBtn" class="btn primary">Create</button></div>
        <button id="joinBtn" class="btn" style="width:100%">Join room</button>
        <button id="leaveBtn" class="btn" style="width:100%;margin-top:8px">Leave room</button>
        <p id="roomStatus">Create a room and share its ID with another player.</p>
        <div class="player"><span class="label">You <span id="myTurn" class="you"></span></span><strong id="myColor">Waiting for opponent</strong></div>
        <div class="player"><span class="label">Opponent</span><strong id="opponentName">Waiting...</strong><br><span id="opponentColor">—</span></div>
      </aside>
    </div>
  </main>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const files = 'abcdefgh';
  const symbols = {w:{p:'♙',r:'♖',n:'♘',b:'♗',q:'♕',k:'♔'},b:{p:'♟',r:'♜',n:'♞',b:'♝',q:'♛',k:'♚'}};
  const state = { chess:new Chess(), peer:null, connection:null, room:null, host:false, color:null, selected:null, opponentName:'Waiting...' };
  const opposite = color => color === 'w' ? 'b' : 'w';
  const colorName = color => color === 'w' ? 'White' : 'Black';
  function status(text){ $('status').textContent = text; }
  function renderLabels(){
    $('roomDisplay').textContent = state.room || 'Not connected';
    $('myColor').textContent = state.color ? colorName(state.color) : 'Waiting for opponent';
    $('opponentColor').textContent = state.color ? colorName(opposite(state.color)) : '—';
    $('myTurn').textContent = state.color && state.chess.turn() === state.color ? 'YOUR TURN' : '';
  }
  function render(){
    const board = $('board'); board.innerHTML = '';
    const rows = state.color === 'b' ? [7,6,5,4,3,2,1,0] : [0,1,2,3,4,5,6,7];
    const cols = state.color === 'b' ? [7,6,5,4,3,2,1,0] : [0,1,2,3,4,5,6,7];
    const data = state.chess.board();
    rows.forEach(r => cols.forEach(c => {
      const square = files[c] + (8-r), button = document.createElement('button');
      button.className = 'square ' + (((r+c)%2) ? 'dark' : 'light'); button.type='button';
      if(state.selected === square) button.classList.add('selected');
      if(state.selected && state.chess.moves({square:state.selected,verbose:true}).some(m=>m.to===square)) button.classList.add('legal');
      const piece = data[r][c];
      if(piece){ const span=document.createElement('span'); span.className='piece'; span.textContent=symbols[piece.color][piece.type]; button.appendChild(span); }
      button.onclick=()=>clickSquare(square); board.appendChild(button);
    }));
    renderLabels();
    if(!state.connection){ status('Create or join a room to start'); return; }
    if(!state.color){ status('Connected — assigning colors...'); return; }
    if(state.chess.is_checkmate()) status('Checkmate');
    else if(state.chess.is_draw()) status('Draw');
    else if(state.chess.in_check()) status('Check — ' + colorName(state.chess.turn()) + ' is threatened');
    else status(state.chess.turn() === state.color ? 'Your turn' : colorName(state.chess.turn()) + ' to move');
  }
  function clickSquare(square){
    if(!state.connection?.open || !state.color || state.chess.turn() !== state.color || state.chess.game_over()) return;
    const piece=state.chess.get(square);
    if(state.selected){
      const legal=state.chess.moves({square:state.selected,verbose:true}).find(m=>m.to===square);
      if(legal){ const move=state.chess.move({from:state.selected,to:square,promotion:'q'}); state.connection.send({type:'move',from:move.from,to:move.to,promotion:move.promotion||'q'}); state.selected=null; render(); return; }
      state.selected=piece?.color===state.color ? square : null;
    } else if(piece?.color===state.color) state.selected=square;
    render();
  }
  function sendHello(){ if(state.connection?.open) state.connection.send({type:'hello',name:'Player'}); }
  function receiveConnection(connection){
    state.connection=connection;
    connection.on('open',()=>{ sendHello(); $('roomStatus').textContent='Connected to room '+state.room; render(); });
    connection.on('data',data=>{
      if(!data?.type) return;
      if(data.type==='hello'){
        $('opponentName').textContent=data.name||'Opponent';
        if(state.host){ state.connection.send({type:'color-assignment',color:state.color}); }
        render(); return;
      }
      if(data.type==='color-assignment' && !state.host){ state.color=data.color; state.chess.reset(); render(); return; }
      if(data.type==='move' && state.color && state.chess.turn()!==state.color){ const move=state.chess.move({from:data.from,to:data.to,promotion:data.promotion||'q'}); if(move) render(); }
    });
    connection.on('close',()=>{state.connection=null; state.color=state.host?state.color:null; $('opponentName').textContent='Waiting...'; $('roomStatus').textContent='Opponent disconnected'; render();});
    connection.on('error',()=>{ $('roomStatus').textContent='Connection error'; });
  }
  function cleanup(){ try{state.connection?.close()}catch(e){} try{state.peer?.destroy()}catch(e){} state.connection=null; state.peer=null; }
  function startRoom(id,host){
    cleanup(); state.room=id; state.host=host; state.color=host ? (Math.random()<.5?'w':'b') : null; state.chess.reset(); state.selected=null; render();
    state.peer=host ? new Peer('chess-'+id) : new Peer();
    state.peer.on('open',()=>{ if(host){$('roomStatus').textContent='Room created. Share ID '+id+' with your opponent.'; render();} else receiveConnection(state.peer.connect('chess-'+id,{reliable:true})); });
    if(host) state.peer.on('connection',connection=>{ if(state.connection?.open) connection.close(); else receiveConnection(connection); });
    state.peer.on('error',error=>{ $('roomStatus').textContent=error.type==='peer-unavailable'?'Room not found. Check the Room ID.':'Connection error: '+error.type; });
  }
  function leave(){ cleanup(); state.room=null; state.host=false; state.color=null; state.chess.reset(); state.selected=null; $('opponentName').textContent='Waiting...'; $('roomStatus').textContent='Create a room and share its ID with another player.'; render(); }
  $('createBtn').onclick=()=>{const id=String(Math.floor(100000+Math.random()*900000)); $('roomInput').value=id; startRoom(id,true);};
  $('joinBtn').onclick=()=>{const id=$('roomInput').value.replace(/\D/g,''); if(id.length!==6){$('roomStatus').textContent='Enter a valid 6-digit Room ID.';return;} startRoom(id,false);};
  $('leaveBtn').onclick=leave; $('roomInput').oninput=()=>{$('roomInput').value=$('roomInput').value.replace(/\D/g,'').slice(0,6)}; $('roomInput').onkeydown=e=>{if(e.key==='Enter')$('joinBtn').click()};
  render();
})();
</script>
</body>
</html>

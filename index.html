<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Royal Chess</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <style>
    :root{--bg:#111827;--panel:rgba(31,41,55,.82);--gold:#f5c76b;--light:#f0d9b5;--dark:#b58863;--move:#147846;--text:#f9fafb;--muted:#9ca3af}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;padding:28px;color:var(--text);font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at top left,#f5c76b26,transparent 35%),radial-gradient(circle at bottom right,#5667f22e,transparent 35%),var(--bg);display:flex;justify-content:center}
    .app{width:min(1200px,100%)}.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:14px}.logo{width:58px;height:58px;display:grid;place-items:center;border-radius:18px;color:#241608;font-size:34px;background:linear-gradient(135deg,#ffe6a3,var(--gold));box-shadow:0 12px 30px #f5c76b40}h1{margin:0;font-size:clamp(1.6rem,4vw,2.4rem);letter-spacing:-1px}.subtitle{margin:4px 0 0;color:var(--muted);font-size:.9rem}.status{padding:12px 17px;border:1px solid #ffffff1a;border-radius:999px;background:var(--panel);color:var(--gold);font-weight:700;white-space:nowrap}
    .layout{display:grid;grid-template-columns:minmax(280px,760px) 300px;gap:24px;align-items:start}.board-shell{padding:14px;border-radius:24px;background:linear-gradient(145deg,#ffffff24,#ffffff0a);box-shadow:0 25px 70px #00000059}.board{width:min(80vw,720px);aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);overflow:hidden;border-radius:14px;box-shadow:inset 0 0 0 2px #00000040}.square{position:relative;display:grid;place-items:center;cursor:pointer;user-select:none;transition:.15s}.light{background:var(--light)}.dark{background:var(--dark)}.square:hover{filter:brightness(1.1)}.selected{box-shadow:inset 0 0 0 5px #f6c945}.last-move{box-shadow:inset 0 0 0 999px #f6c94533}.check{box-shadow:inset 0 0 0 999px #ef44448c}.legal:after{content:"";width:23%;height:23%;border-radius:50%;background:#147846a6;position:absolute}.capture:after{content:"";position:absolute;inset:9%;border:6px solid #147846b3;border-radius:50%}.piece{position:relative;z-index:2;font-size:clamp(2rem,8vw,5.6rem);line-height:1;filter:drop-shadow(0 4px 2px #00000059)}.white-piece{color:#fffaf0;text-shadow:0 2px 0 #8f7351,0 4px 8px #00000073}.black-piece{color:#16120e;text-shadow:0 2px 0 #856b4d,0 4px 8px #0000008c}.coordinate{position:absolute;z-index:3;left:6px;bottom:4px;font-size:.68rem;font-weight:800;opacity:.65}.light .coordinate{color:#8f6d45}.dark .coordinate{color:#f3d6a4}
    .panel{padding:20px;border:1px solid #ffffff1a;border-radius:22px;background:var(--panel);backdrop-filter:blur(14px);box-shadow:0 18px 45px #0003}.panel h2{margin:0 0 18px;font-size:1.1rem}.player-card{display:flex;align-items:center;gap:12px;padding:13px;margin-bottom:12px;border-radius:15px;background:#ffffff14}.avatar{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;color:#241608;font-size:1.2rem;background:linear-gradient(135deg,#ffe6a3,var(--gold))}.player-name{font-weight:800}.player-color{color:var(--muted);font-size:.78rem;margin-top:2px}.moves{height:245px;overflow-y:auto;margin:18px 0;padding:10px;border-radius:14px;background:#0000002e}.move-row{display:grid;grid-template-columns:35px 1fr 1fr;gap:8px;padding:8px 6px;border-bottom:1px solid #ffffff0f;font-size:.9rem}.move-number{color:var(--gold);font-weight:800}.empty{color:var(--muted);text-align:center;padding:70px 10px;font-size:.9rem}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{border:0;padding:12px;border-radius:12px;color:var(--text);background:#ffffff1a;cursor:pointer;font-weight:800;transition:.2s}button:hover{background:#ffffff2e;transform:translateY(-2px)}button.primary{color:#271807;background:linear-gradient(135deg,#ffe6a3,var(--gold))}.hint{margin:18px 0 0;color:var(--muted);text-align:center;font-size:.78rem;line-height:1.5}@media(max-width:900px){body{padding:18px}.topbar{align-items:flex-start;flex-direction:column}.status{width:100%;text-align:center}.layout{grid-template-columns:1fr}.board{width:100%}}
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar"><div class="brand"><div class="logo">♞</div><div><h1>Royal Chess</h1><p class="subtitle">A beautiful battle of minds</p></div></div><div class="status" id="status">White to move</div></header>
    <section class="layout"><div class="board-shell"><div class="board" id="board"></div></div><aside class="panel"><h2>Game Room</h2><div class="player-card"><div class="avatar">♔</div><div><div class="player-name">White Player</div><div class="player-color">Your side</div></div></div><div class="player-card"><div class="avatar">♚</div><div><div class="player-name">Black Player</div><div class="player-color">Computer opponent</div></div></div><h2>Move History</h2><div class="moves" id="moves"><div class="empty">The game has not started yet.</div></div><div class="controls"><button class="primary" id="newGame">New Game</button><button id="undo">Undo Move</button><button id="flip">Flip Board</button><button id="sound">Sound: On</button></div><p class="hint">Click a piece to see its legal moves.<br>Capture the king to win the battle.</p></aside></section>
  </main>
  <script>
    const boardEl=document.getElementById('board'),statusEl=document.getElementById('status'),movesEl=document.getElementById('moves');
    const symbols={w:{k:'♔',q:'♕',r:'♖',b:'♗',n:'♘',p:'♙'},b:{k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'}},files=['a','b','c','d','e','f','g','h'];
    let game=new Chess(),selected=null,flipped=false,sound=true;
    function beep(capture){if(!sound)return;const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.frequency.value=capture?180:320;g.gain.value=.06;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.08)}
    function render(){boardEl.innerHTML='';const b=game.board(),last=game.history({verbose:true}).slice(-1)[0];for(let r=0;r<8;r++)for(let c=0;c<8;c++){let ar=flipped?7-r:r,ac=flipped?7-c:c,sq=files[ac]+(8-ar),p=b[ar][ac],el=document.createElement('div');el.className='square '+((ar+ac)%2?'dark':'light');el.dataset.square=sq;if(selected===sq)el.classList.add('selected');if(last&&(last.from===sq||last.to===sq))el.classList.add('last-move');if(selected){let m=game.moves({square:selected,verbose:true}).find(x=>x.to===sq);if(m)el.classList.add(m.captured?'capture':'legal')}if(p&&p.type==='k'&&p.color===game.turn()&&game.in_check())el.classList.add('check');if(p){let pe=document.createElement('span');pe.className='piece '+(p.color==='w'?'white-piece':'black-piece');pe.textContent=symbols[p.color][p.type];el.appendChild(pe)}let co=document.createElement('span');co.className='coordinate';co.textContent=sq;el.appendChild(co);el.onclick=()=>clickSquare(sq);boardEl.appendChild(el)}}
    function clickSquare(sq){if(game.game_over()||game.turn()==='b')return;let p=game.get(sq);if(selected){let m=game.moves({square:selected,verbose:true}).find(x=>x.to===sq);if(m){move(selected,sq);return}selected=null}if(p&&p.color==='w')selected=sq;render()}
    function move(from,to){let p=game.get(from),promotion='q';if(p&&p.type==='p'&&(to.endsWith('8')||to.endsWith('1'))){let x=prompt('Promote to: queen, rook, bishop, or knight','queen')||'queen';promotion={queen:'q',rook:'r',bishop:'b',knight:'n'}[x.toLowerCase()]||'q'}let m=game.move({from,to,promotion});if(!m)return;selected=null;beep(!!m.captured);update();if(!game.game_over()&&game.turn()==='b')setTimeout(computer,500)}
    function computer(){let ms=game.moves({verbose:true}),caps=ms.filter(m=>m.captured),m=(caps.length?caps:ms)[Math.floor(Math.random()*(caps.length?caps:ms).length)];if(!m)return;game.move({from:m.from,to:m.to,promotion:'q'});beep(!!m.captured);update()}
    function update(){render();let s=game.turn()==='w'?'White to move':'Black is thinking';if(game.in_checkmate())s=game.turn()==='w'?'Black wins by checkmate!':'White wins by checkmate!';else if(game.in_draw())s='Game drawn';else if(game.in_check())s+=' — Check!';statusEl.textContent=s;history()}
    function history(){let h=game.history();if(!h.length){movesEl.innerHTML='<div class="empty">The game has not started yet.</div>';return}movesEl.innerHTML='';for(let i=0;i<h.length;i+=2){let row=document.createElement('div');row.className='move-row';row.innerHTML=`<span class="move-number">${i/2+1}.</span><span>${h[i]||''}</span><span>${h[i+1]||''}</span>`;movesEl.appendChild(row)}movesEl.scrollTop=movesEl.scrollHeight}
    document.getElementById('newGame').onclick=()=>{game.reset();selected=null;update()};document.getElementById('undo').onclick=()=>{if(game.history().length)game.undo();if(game.history().length&&game.turn()==='b')game.undo();selected=null;update()};document.getElementById('flip').onclick=()=>{flipped=!flipped;render()};document.getElementById('sound').onclick=e=>{sound=!sound;e.target.textContent='Sound: '+(sound?'On':'Off')};update();
  </script>
</body>
</html>

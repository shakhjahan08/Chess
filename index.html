<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Royal Chess Arena</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg-1: #08111f;
      --bg-2: #0f172a;
      --panel: rgba(15, 23, 42, 0.82);
      --panel-soft: rgba(17, 24, 39, 0.72);
      --card: #111827;
      --light-square: #f0d9b5;
      --dark-square: #b58863;
      --board-frame: #1f2937;
      --gold: #f7c873;
      --gold-2: #d9a441;
      --blue: #38bdf8;
      --blue-2: #2563eb;
      --green: #22c55e;
      --red: #ef4444;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --shadow: rgba(0, 0, 0, 0.28);
      --legal: rgba(34, 197, 94, 0.42);
      --selected: rgba(56, 189, 248, 0.6);
      --last-move: rgba(250, 204, 21, 0.48);
      --promo-bg: rgba(15, 23, 42, 0.94);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top, #172554 0%, var(--bg-2) 35%, var(--bg-1) 100%);
      color: var(--text);
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .app {
      width: min(1200px, 100%);
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 20px 60px var(--shadow);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      padding-bottom: 18px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.18);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      font-size: 2rem;
      background: linear-gradient(135deg, var(--gold), var(--gold-2));
      color: #111827;
      box-shadow: 0 12px 30px rgba(247, 200, 115, 0.3);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.5rem, 2vw, 2.4rem);
      line-height: 1;
    }

    .subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .status-pill {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(148, 163, 184, 0.2);
      color: var(--text);
      border-radius: 999px;
      padding: 10px 16px;
      font-weight: 700;
      min-height: 44px;
      display: flex;
      align-items: center;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 18px 0 10px;
    }

    .mode-switch, .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .mode-btn, .action-btn, .promo-btn {
      border: 1px solid rgba(148, 163, 184, 0.2);
      background: rgba(255,255,255,0.03);
      color: var(--text);
      border-radius: 12px;
      padding: 10px 14px;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
      font-weight: 700;
      min-height: 44px;
    }

    .mode-btn:hover, .action-btn:hover, .promo-btn:hover {
      transform: translateY(-1px);
      background: rgba(255,255,255,0.06);
    }

    .mode-btn.active {
      background: linear-gradient(135deg, var(--gold), var(--gold-2));
      color: #111827;
      border-color: transparent;
    }

    .action-btn.primary {
      background: linear-gradient(135deg, var(--blue), var(--blue-2));
      border-color: transparent;
      color: white;
    }

    .action-btn.danger {
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      border-color: transparent;
      color: white;
    }

    .play-area {
      display: grid;
      grid-template-columns: minmax(260px, 330px) minmax(320px, 1fr);
      gap: 22px;
      padding-top: 20px;
    }

    .side-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 18px;
      padding: 14px;
      box-shadow: 0 16px 34px rgba(0,0,0,0.18);
    }

    .player-card {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: center;
      min-height: 88px;
    }

    .piece-badge {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      font-size: 1.7rem;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(148,163,184,0.2);
    }

    .player-meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .player-label {
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0.9;
    }

    .player-name {
      font-size: 1.04rem;
      font-weight: 700;
    }

    .clock {
      font-weight: 800;
      font-size: 1.5rem;
      color: var(--gold);
      font-variant-numeric: tabular-nums;
      text-align: right;
      min-width: 90px;
    }

    .player-card.active {
      border-color: rgba(247, 200, 115, 0.75);
      box-shadow: inset 0 0 0 1px rgba(247, 200, 115, 0.25);
    }

    .mini-label {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 8px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .connect-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(148,163,184,0.25);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 1rem;
    }

    input[readonly] { opacity: 0.92; }

    .capture-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .capture-box .mini-box {
      min-height: 66px;
      padding: 10px;
      border-radius: 12px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(148,163,184,0.12);
    }

    .pieces-row {
      margin-top: 8px;
      font-size: 1.5rem;
      letter-spacing: 0.08em;
      min-height: 28px;
      line-height: 1.3;
    }

    .move-list {
      max-height: 240px;
      overflow: auto;
      padding-right: 4px;
    }

    .moves-grid {
      display: grid;
      grid-template-columns: 48px 1fr 1fr;
      gap: 8px;
      align-items: center;
      padding: 4px 0;
      font-size: 0.96rem;
      border-bottom: 1px solid rgba(148,163,184,0.08);
    }

    .moves-grid .num { color: var(--muted); }
    .moves-grid .move-cell { font-weight: 700; }

    .board-panel {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
    }

    .board-shell {
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid rgba(148,163,184,0.16);
      border-radius: 24px;
      padding: 16px;
      box-shadow: 0 18px 42px rgba(0,0,0,0.24);
      position: relative;
      width: min(100%, 700px);
    }

    .board {
      width: min(72vmin, 620px);
      max-width: 100%;
      aspect-ratio: 1 / 1;
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      grid-template-rows: repeat(8, minmax(0, 1fr));
      border-radius: 18px;
      overflow: hidden;
      border: 8px solid var(--board-frame);
      box-shadow: inset 0 0 0 4px rgba(255,255,255,0.05);
      margin: 0 auto;
    }

    .square {
      position: relative;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(2.2rem, 4vw, 3.3rem);
      line-height: 1;
      user-select: none;
      cursor: pointer;
      transition: filter 0.12s ease, transform 0.12s ease;
      padding: 0;
    }

    .square:hover { filter: brightness(1.04); }
    .square.light { background: var(--light-square); }
    .square.dark { background: var(--dark-square); }
    .square.selected { box-shadow: inset 0 0 0 5px var(--selected); }
    .square.legal::after {
      content: "";
      position: absolute;
      width: 18%;
      height: 18%;
      border-radius: 50%;
      background: rgba(34, 197, 94, 0.72);
      box-shadow: 0 0 0 5px rgba(34, 197, 94, 0.12);
    }
    .square.last-move { box-shadow: inset 0 0 0 4px var(--last-move); }

    .square .label {
      position: absolute;
      left: 7px;
      bottom: 7px;
      font-size: 0.68rem;
      color: rgba(17, 24, 39, 0.7);
      font-weight: 700;
    }

    .result-banner {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(247, 200, 115, 0.35);
      color: var(--text);
      border-radius: 999px;
      padding: 10px 18px;
      font-weight: 700;
      letter-spacing: 0.04em;
      box-shadow: 0 18px 50px rgba(0,0,0,0.24);
      white-space: nowrap;
    }

    .promo-overlay {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      padding: 18px;
    }

    .promo-panel {
      background: var(--promo-bg);
      border: 1px solid rgba(148,163,184,0.2);
      border-radius: 20px;
      padding: 18px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 28px 80px rgba(0,0,0,0.4);
    }

    .promo-title {
      margin: 0 0 16px;
      font-size: 1.3rem;
      text-align: center;
    }

    .promo-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .promo-btn {
      display: grid;
      place-items: center;
      font-size: 2rem;
      min-height: 64px;
      background: rgba(255,255,255,0.04);
    }

    .hidden { display: none !important; }

    @media (max-width: 900px) {
      .play-area {
        grid-template-columns: 1fr;
      }

      .side-panel {
        order: 2;
      }

      .board-panel {
        order: 1;
      }

      .board {
        width: min(88vw, 520px);
      }
    }

    @media (max-width: 520px) {
      body { padding: 8px; }
      .app { padding: 12px; border-radius: 18px; }
      .topbar, .toolbar { align-items: stretch; }
      .brand { width: 100%; }
      .status-pill { width: 100%; justify-content: center; }
      .controls, .mode-switch { width: 100%; }
      .controls > *, .mode-switch > * { flex: 1 1 42%; }
      .input-row { flex-direction: column; }
      .capture-box { grid-template-columns: 1fr; }
      .promo-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .clock { font-size: 1.2rem; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo">♞</div>
        <div>
          <h1>Royal Chess Arena</h1>
          <p class="subtitle">Local, bot, and online matches with live clocks</p>
        </div>
      </div>
      <div id="status" class="status-pill">White to move</div>
    </header>

    <section class="toolbar">
      <div class="mode-switch">
        <button class="mode-btn active" data-mode="local">Local</button>
        <button class="mode-btn" data-mode="bot">Vs Bot</button>
        <button class="mode-btn" data-mode="online">Online</button>
      </div>
      <div class="controls">
        <button id="newGame" class="action-btn primary">New Game</button>
        <button id="flipBoard" class="action-btn">Flip Board</button>
        <button id="resetClock" class="action-btn danger">Reset Clock</button>
      </div>
    </section>

    <section class="play-area">
      <aside class="side-panel">
        <div class="card player-card active" id="whiteCard">
          <div class="piece-badge">♔</div>
          <div class="player-meta">
            <div class="player-label">White</div>
            <div class="player-name">Player 1</div>
          </div>
          <div id="whiteClock" class="clock">10:00</div>
        </div>

        <div class="card player-card" id="blackCard">
          <div class="piece-badge">♚</div>
          <div class="player-meta">
            <div class="player-label">Black</div>
            <div class="player-name">Player 2</div>
          </div>
          <div id="blackClock" class="clock">10:00</div>
        </div>

        <div class="card connect-box">
          <div class="mini-label">Online Match</div>
          <div class="input-row">
            <input id="myId" type="text" readonly placeholder="Your Peer ID" />
            <button id="copyId" class="action-btn">Copy</button>
          </div>
          <div class="input-row">
            <input id="friendId" type="text" placeholder="Opponent ID" />
            <button id="joinGame" class="action-btn primary">Connect</button>
          </div>
        </div>

        <div class="card capture-box">
          <div class="mini-box">
            <div class="mini-label">White Captures</div>
            <div id="whiteCaptured" class="pieces-row"></div>
          </div>
          <div class="mini-box">
            <div class="mini-label">Black Captures</div>
            <div id="blackCaptured" class="pieces-row"></div>
          </div>
        </div>

        <div class="card">
          <div class="mini-label">Move List</div>
          <div id="moveList" class="move-list"></div>
        </div>
      </aside>

      <div class="board-panel">
        <div class="board-shell">
          <div id="board" class="board"></div>
          <div id="resultBanner" class="result-banner hidden"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="promotionModal" class="promo-overlay hidden" aria-live="polite">
    <div class="promo-panel">
      <h2 class="promo-title">Choose promotion</h2>
      <div class="promo-grid">
        <button class="promo-btn" data-promotion="q">♕</button>
        <button class="promo-btn" data-promotion="r">♖</button>
        <button class="promo-btn" data-promotion="b">♗</button>
        <button class="promo-btn" data-promotion="n">♘</button>
      </div>
    </div>
  </div>

  <script>
    const files = 'abcdefgh';
    const pieceMap = {
      w: { k: '♔', q: '♕', r: '♖', b: '♗', n: '♘', p: '♙' },
      b: { k: '♚', q: '♛', r: '♜', b: '♝', n: '♞', p: '♟' }
    };
    const material = { p: 1, n: 3, b: 3, r: 5, q: 9, k: 0 };

    const state = {
      mode: 'local',
      game: new Chess(),
      selected: null,
      flipped: false,
      modeChanged: false,
      lastMove: null,
      pendingPromotion: null,
      peer: null,
      conn: null,
      onlineRole: null,
      timerId: null,
      whiteClock: 600,
      blackClock: 600,
      activeClock: 'w',
      gameOver: false,
      captured: { w: [], b: [] }
    };

    const $ = (id) => document.getElementById(id);
    const boardEl = $('board');

    function setStatus(msg) {
      $('status').textContent = msg;
    }

    function formatClock(totalSeconds) {
      const safe = Math.max(0, Math.ceil(totalSeconds));
      const minutes = Math.floor(safe / 60);
      const seconds = safe % 60;
      return `${minutes}:${String(seconds).padStart(2, '0')}`;
    }

    function updateClocks() {
      $('whiteClock').textContent = formatClock(state.whiteClock);
      $('blackClock').textContent = formatClock(state.blackClock);
      $('whiteCard').classList.toggle('active', state.activeClock === 'w' && !state.gameOver);
      $('blackCard').classList.toggle('active', state.activeClock === 'b' && !state.gameOver);
    }

    function updateCaptured() {
      $('whiteCaptured').textContent = state.captured.w.map((piece) => pieceMap.b[piece] || '').join(' ');
      $('blackCaptured').textContent = state.captured.b.map((piece) => pieceMap.w[piece] || '').join(' ');
    }

    function renderMoves() {
      const history = state.game.history({ verbose: true });
      const rows = [];
      for (let i = 0; i < history.length; i += 2) {
        const whiteMove = history[i];
        const blackMove = history[i + 1];
        rows.push(`
          <div class="moves-grid">
            <div class="num">${Math.floor(i / 2) + 1}.</div>
            <div class="move-cell">${whiteMove ? whiteMove.san : ''}</div>
            <div class="move-cell">${blackMove ? blackMove.san : ''}</div>
          </div>
        `);
      }
      $('moveList').innerHTML = rows.join('');
    }

    function clearClockTimer() {
      if (state.timerId) {
        clearInterval(state.timerId);
        state.timerId = null;
      }
    }

    function startClock() {
      clearClockTimer();
      state.timerId = setInterval(() => {
        if (state.gameOver) return;

        if (state.activeClock === 'w') {
          state.whiteClock = Math.max(0, state.whiteClock - 1);
          if (state.whiteClock <= 0) {
            finishGame('Black wins on time');
          }
        } else {
          state.blackClock = Math.max(0, state.blackClock - 1);
          if (state.blackClock <= 0) {
            finishGame('White wins on time');
          }
        }
        updateClocks();
      }, 1000);
    }

    function finishGame(message) {
      state.gameOver = true;
      clearClockTimer();
      $('resultBanner').textContent = message;
      $('resultBanner').classList.remove('hidden');
      setStatus(message);
      updateClocks();
    }

    function resetBoardForNewGame() {
      state.game = new Chess();
      state.selected = null;
      state.lastMove = null;
      state.pendingPromotion = null;
      state.gameOver = false;
      state.whiteClock = 600;
      state.blackClock = 600;
      state.activeClock = 'w';
      state.captured = { w: [], b: [] };
      $('resultBanner').classList.add('hidden');
      updateCaptured();
      renderMoves();
      renderBoard();
      updateClocks();

      if (state.mode === 'bot') {
        setStatus('Bot mode: you are White');
      } else if (state.mode === 'online') {
        setStatus(state.onlineRole === 'w' ? 'You are White - make the first move' : 'Connected. Black to move first');
      } else {
        setStatus('White to move');
      }

      startClock();
    }

    function playTone() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        oscillator.type = 'triangle';
        oscillator.frequency.value = 520;
        gain.gain.value = 0.04;
        oscillator.connect(gain);
        gain.connect(audioCtx.destination);
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.08);
      } catch (e) {
        // ignore unsupported browsers
      }
    }

    function applyMove(from, to, promotion = 'q') {
      const moves = state.game.moves({ square: from, verbose: true });
      const match = moves.find((m) => m.to === to && (m.promotion || 'q') === promotion);
      if (!match) return false;

      const result = state.game.move({ from, to, promotion });
      if (!result) return false;

      state.lastMove = { from, to };
      if (result.captured) {
        const capturer = result.color;
        if (capturer === 'w') state.captured.w.push(result.captured);
        else state.captured.b.push(result.captured);
      }

      playTone();
      updateCaptured();
      renderMoves();
      state.activeClock = state.game.turn();
      updateClocks();
      renderBoard();
      return true;
    }

    function maybeFinishByRules() {
      if (state.game.in_checkmate()) {
        const winner = state.game.turn() === 'w' ? 'Black' : 'White';
        finishGame(`${winner} wins by checkmate`);
        return true;
      }
      if (state.game.in_stalemate()) {
        finishGame('Draw by stalemate');
        return true;
      }
      if (state.game.insufficient_material()) {
        finishGame('Draw by insufficient material');
        return true;
      }
      if (state.game.in_threefold_repetition()) {
        finishGame('Draw by repetition');
        return true;
      }
      if (state.game.in_check()) {
        setStatus(`${state.game.turn() === 'w' ? 'White' : 'Black'} is in check`);
      }
      return false;
    }

    function handleMoveComplete(from, to, chosenPromotion = 'q') {
      if (state.gameOver) return;

      const valid = applyMove(from, to, chosenPromotion);
      if (!valid) return;

      if (state.mode === 'online' && state.conn && state.conn.open) {
        state.conn.send({ type: 'move', from, to, promotion: chosenPromotion });
      }

      if (!maybeFinishByRules()) {
        if (state.mode === 'bot' && state.game.turn() === 'b') {
          setStatus('Bot is thinking...');
          setTimeout(() => {
            if (state.gameOver) return;
            const options = state.game.moves({ verbose: true });
            if (!options.length) return;

            let best = options[0];
            options.forEach((move) => {
              const moveScore = material[move.captured || 'p'] || 0;
              const bestScore = material[best.captured || 'p'] || 0;
              if (moveScore > bestScore) best = move;
            });

            applyMove(best.from, best.to, best.promotion || 'q');
            maybeFinishByRules();
            setStatus('White to move');
            renderBoard();
          }, 550);
        } else {
          setStatus(state.game.turn() === 'w' ? 'White to move' : 'Black to move');
        }
      }
    }

    function handleSquareClick(square) {
      if (state.gameOver) return;

      if (state.mode === 'bot' && state.game.turn() !== 'w') return;

      if (state.mode === 'online') {
        const isMyTurn = state.onlineRole && state.game.turn() === state.onlineRole;
        if (!isMyTurn) {
          setStatus('Waiting for opponent move');
          return;
        }
      }

      const piece = state.game.get(square);
      const legal = state.selected ? state.game.moves({ square: state.selected, verbose: true }) : [];

      if (state.selected) {
        const match = legal.find((move) => move.to === square);
        if (match) {
          if (match.promotion) {
            state.pendingPromotion = { from: state.selected, to: square };
            $('promotionModal').classList.remove('hidden');
            return;
          }
          handleMoveComplete(state.selected, square);
          state.selected = null;
          renderBoard();
          return;
        }
      }

      if (piece && piece.color === state.game.turn()) {
        state.selected = square;
        renderBoard();
      } else {
        state.selected = null;
        renderBoard();
      }
    }

    function renderBoard() {
      boardEl.innerHTML = '';
      const board = state.game.board();
      const targetSquares = state.selected ? state.game.moves({ square: state.selected, verbose: true }).map((move) => move.to) : [];

      for (let row = 0; row < 8; row++) {
        for (let col = 0; col < 8; col++) {
          const displayRow = state.flipped ? 7 - row : row;
          const displayCol = state.flipped ? 7 - col : col;
          const squareName = `${files[displayCol]}${8 - displayRow}`;

          const button = document.createElement('button');
          const isLight = (row + col) % 2 === 0;
          button.className = `square ${isLight ? 'light' : 'dark'}`;

          if (state.selected === squareName) button.classList.add('selected');
          if (state.lastMove && (state.lastMove.from === squareName || state.lastMove.to === squareName)) button.classList.add('last-move');
          if (targetSquares.includes(squareName)) button.classList.add('legal');

          const piece = board[displayRow][displayCol];
          if (piece) {
            button.textContent = pieceMap[piece.color][piece.type];
          }

          const shouldLabel = (displayRow === 7 && !state.flipped) || (displayRow === 0 && state.flipped) || (displayCol === 0 && ((state.flipped && displayRow === 7) || (!state.flipped && displayRow === 0)));
          if (shouldLabel) {
            const label = document.createElement('span');
            label.className = 'label';
            label.textContent = `${files[displayCol]}`;
            button.appendChild(label);
          }

          button.addEventListener('click', () => handleSquareClick(squareName));
          boardEl.appendChild(button);
        }
      }
    }

    function setMode(nextMode) {
      state.mode = nextMode;
      document.querySelectorAll('.mode-btn').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.mode === nextMode);
      });

      if (nextMode === 'bot') {
        setStatus('Bot mode: you are White');
      } else if (nextMode === 'online') {
        setStatus('Online mode: connect with a friend ID');
      } else {
        setStatus('White to move');
      }

      if (nextMode !== 'online') {
        if (state.conn && state.conn.open) state.conn.close();
        state.conn = null;
        state.onlineRole = null;
      }

      resetBoardForNewGame();
    }

    function initPeer() {
      if (state.peer) return;
      state.peer = new Peer();
      state.peer.on('open', (id) => {
        $('myId').value = id;
      });

      state.peer.on('connection', (conn) => {
        state.conn = conn;
        state.onlineRole = 'b';
        setStatus('Connected! You are Black');
        conn.on('data', (data) => {
          if (data.type === 'move') {
            const success = applyMove(data.from, data.to, data.promotion || 'q');
            if (success) {
              maybeFinishByRules();
              setStatus(state.game.turn() === state.onlineRole ? 'Your turn' : 'Opponent turn');
              renderBoard();
            }
          }
        });
        conn.on('close', () => {
          setStatus('Connection closed');
        });
      });

      state.peer.on('error', (err) => {
        setStatus(`Peer issue: ${err.type}`);
      });
    }

    function connectToOpponent(id) {
      if (!state.peer || !state.peer.open) initPeer();
      const cleanId = id.trim();
      if (!cleanId) {
        setStatus('Enter a valid opponent ID');
        return;
      }
      if (cleanId === $('myId').value) {
        setStatus('You cannot connect to yourself');
        return;
      }

      const conn = state.peer.connect(cleanId);
      state.conn = conn;
      state.onlineRole = 'w';

      conn.on('open', () => {
        setStatus('Connected! You are White');
        resetBoardForNewGame();
      });

      conn.on('data', (data) => {
        if (data.type === 'move') {
          const success = applyMove(data.from, data.to, data.promotion || 'q');
          if (success) {
            maybeFinishByRules();
            setStatus(state.game.turn() === state.onlineRole ? 'Your turn' : 'Opponent turn');
            renderBoard();
          }
        }
      });

      conn.on('close', () => {
        setStatus('Connection closed');
      });
    }

    function confirmPromotion(choice) {
      if (!state.pendingPromotion) return;
      handleMoveComplete(state.pendingPromotion.from, state.pendingPromotion.to, choice);
      state.pendingPromotion = null;
      $('promotionModal').classList.add('hidden');
      state.selected = null;
      renderBoard();
    }

    document.querySelectorAll('.mode-btn').forEach((button) => {
      button.addEventListener('click', () => setMode(button.dataset.mode));
    });

    $('newGame').addEventListener('click', resetBoardForNewGame);
    $('flipBoard').addEventListener('click', () => {
      state.flipped = !state.flipped;
      renderBoard();
    });
    $('resetClock').addEventListener('click', () => {
      state.whiteClock = 600;
      state.blackClock = 600;
      state.activeClock = 'w';
      updateClocks();
      if (!state.gameOver) {
        clearClockTimer();
        startClock();
      }
    });

    $('copyId').addEventListener('click', async () => {
      const id = $('myId').value;
      if (!id) return;
      try {
        await navigator.clipboard.writeText(id);
        setStatus('Peer ID copied to clipboard');
      } catch (e) {
        setStatus('Copy failed. Please copy the ID manually.');
      }
    });

    $('joinGame').addEventListener('click', () => {
      initPeer();
      connectToOpponent($('friendId').value);
    });

    document.querySelectorAll('.promo-btn').forEach((button) => {
      button.addEventListener('click', () => confirmPromotion(button.dataset.promotion));
    });

    initPeer();
    updateClocks();
    updateCaptured();
    renderBoard();
    renderMoves();
    startClock();
  </script>
</body>
</html>

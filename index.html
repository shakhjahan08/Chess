<script>
const $=id=>document.getElementById(id), files='abcdefgh', glyph={w:{p:'♙',r:'♖',n:'♘',b:'♗',q:'♕',k:'♔'},b:{p:'♟',r:'♜',n:'♞',b:'♝',q:'♛',k:'♚'}};
const randomId=()=>Array.from({length:14},()=>Math.floor(Math.random()*10)).join('');
const state={name:localStorage.chessName||'Player',rating:Math.max(0,Math.min(9000,Number(localStorage.chessRating||0))),gameId:localStorage.chessGameId||randomId(),theme:localStorage.chessTheme||'royal',chess:new Chess(),selected:null,flipped:false,mode:'none',aiLevel:10,lastMove:null,peer:null,connection:null,roomHost:false};
localStorage.chessGameId=state.gameId;
function rank(r){if(r>=6000)return'A';if(r>=5000)return'B';if(r>=4000)return'C';if(r>=3000)return'D';if(r>=2000)return'E';if(r>=1000)return'F';return'G'}
function applyProfile(){ $('gameId').textContent=state.gameId;$('playerName').textContent=state.name;$('whiteName').textContent=state.name;$('avatar').textContent=(state.name[0]||'P').toUpperCase();$('dashName').textContent=state.name;$('dashRating').textContent=state.rating;$('dashRank').textContent=rank(state.rating);$('dashId').textContent=state.gameId;$('nameInput').value=state.name;$('ratingInput').value=state.rating;$('themeInput').value=state.theme;document.body.dataset.theme=state.theme}
function render(){const b=$('board');b.innerHTML='';const rows=state.flipped?[7,6,5,4,3,2,1,0]:[0,1,2,3,4,5,6,7];rows.forEach(r=>(state.flipped?[7,6,5,4,3,2,1,0]:[0,1,2,3,4,5,6,7]).forEach(c=>{const sq=files[c]+(8-r),el=document.createElement('button'),p=state.chess.get(sq);el.className='square '+((r+c)%2?'dark':'light');el.dataset.square=sq;if(p){const s=document.createElement('span');s.className='piece '+(p.color==='w'?'white-piece':'black-piece');s.textContent=glyph[p.color][p.type];el.append(s)}if(state.selected===sq)el.classList.add('selected');if(state.selected&&state.chess.moves({square:state.selected,verbose:true}).some(m=>m.to===sq))el.classList.add('legal');if(state.lastMove&&(state.lastMove.from===sq||state.lastMove.to===sq))el.classList.add('last');el.onclick=()=>squareClick(sq);b.append(el)}));updateMoves();updateStatus()}
function updateStatus(){let t;if(state.chess.isCheckmate())t='Checkmate — '+(state.chess.turn()==='w'?'Black':'White')+' wins';else if(state.chess.isDraw())t='Draw';else t=(state.chess.turn()==='w'?'White':'Black')+' to move'+(state.chess.in_check()?' — Check':'');$('status').textContent=t}
function updateMoves(){const h=state.chess.history(),m=$('moves');if(!h.length){m.innerHTML='<div class="move"><em>1.</em><span>—</span><span>—</span></div>';return}m.innerHTML='';for(let i=0;i<h.length;i+=2){const d=document.createElement('div');d.className='move';d.innerHTML='<em>'+(i/2+1)+'.</em><span>'+h[i]+'</span><span>'+(h[i+1]||'')+'</span>';m.append(d)}}
function squareClick(sq){if(state.mode==='online'&&state.connection&&!state.roomHost&&state.chess.turn()==='w')return;const p=state.chess.get(sq);if(state.selected){const move=state.chess.move({from:state.selected,to:sq,promotion:'q'});if(move){state.lastMove={from:state.selected,to:sq};state.selected=null;render();sendMove(move);if(state.mode==='ai'&&state.chess.turn()==='b')setTimeout(aiMove,220);return}state.selected=p&&p.color===state.chess.turn()?sq:null}else if(p&&p.color===state.chess.turn())state.selected=sq;render()}
function reset(){state.chess.reset();state.selected=null;state.lastMove=null;render()}
function setMode(mode){state.mode=mode;reset();$('opponentName').textContent=mode==='ai'?'AI Level '+state.aiLevel:'Opponent';$('opponentLabel').textContent=mode==='ai'?'Black / Computer':'Black';$('status').textContent=mode==='ai'?'White to move — make your move':'White to move'}
function aiMove(){if(state.mode!=='ai'||state.chess.game_over()||state.chess.turn()!=='b')return;const moves=state.chess.moves({verbose:true});if(!moves.length)return;const level=state.aiLevel,depth=level<5?1:level<14?2:3;let best=null,bestScore=-Infinity;for(const mv of moves){state.chess.move(mv);let score=-minimax(state.chess,depth-1,-Infinity,Infinity,false);state.chess.undo();score+=(Math.random()*(21-level));if(score>bestScore){bestScore=score;best=mv}}if(best){const move=state.chess.move(best);state.lastMove={from:best.from,to:best.to};render()}}
function minimax(g,d,a,b,maximizing){if(d===0||g.game_over())return evaluate(g);const ms=g.moves({verbose:true});let value=maximizing?-Infinity:Infinity;for(const m of ms){g.move(m);const s=minimax(g,d-1,a,b,!maximizing);g.undo();if(maximizing){value=Math.max(value,s);a=Math.max(a,value)}else{value=Math.min(value,s);b=Math.min(b,value)}if(b<=a)break}return value}
function evaluate(g){const v={p:100,n:320,b:330,r:500,q:900,k:20000};return g.board().flat().reduce((s,p)=>s+(p?(p.color==='w'?1:-1)*v[p.type]:0),0)}
function sendMove(move){if(state.connection)state.connection.send({type:'move',move})}
const bind = (id, handler) => { const el = $(id); if (el) el.onclick = handler; };
function close(id){const el=$(id); if(el) el.hidden=true}document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>close(b.dataset.close));bind('playBtn',()=>{$('playMenu').hidden=false});bind('aiModeBtn',()=>{close('playMenu');$('aiMenu').hidden=false});bind('onlineModeBtn',()=>{close('playMenu');$('onlineMenu').hidden=false});$('aiLevel').oninput=e=>{$('aiLevelValue').textContent=e.target.value;state.aiLevel=+e.target.value;$('aiDescription').textContent=e.target.value<7?'Beginner opponent':e.target.value<14?'Balanced opponent':'Advanced opponent'};bind('startAiBtn',()=>{state.aiLevel=+$('aiLevel').value;setMode('ai');close('aiMenu')});bind('undoBtn',()=>{state.chess.undo();state.lastMove=null;render()});bind('flipBtn',()=>{state.flipped=!state.flipped;$('board').classList.add('flipping');setTimeout(()=>{$('board').classList.remove('flipping');render()},260)});bind('settingsBtn',()=>{$('settingsMenu').hidden=false;applyProfile()});bind('dashboardSettings',()=>{$('settingsMenu').hidden=false;applyProfile()});bind('saveSettingsBtn',()=>{state.name=$('nameInput').value.trim()||'Player';state.rating=Math.max(0,Math.min(9000,+$('ratingInput').value||0));state.theme=$('themeInput').value;localStorage.chessName=state.name;localStorage.chessRating=state.rating;localStorage.chessTheme=state.theme;applyProfile();close('settingsMenu')});bind('dashboardBtn',()=>{$('dashboard').scrollIntoView({behavior:'smooth'})});bind('createRoomBtn',()=>{if(typeof Peer==='undefined'){$('onlineStatus').textContent='Online library could not load.';return}const room=$('roomInput').value.replace(/\D/g,'')||randomId();$('roomInput').value=room;state.roomHost=true;state.peer=new Peer('chess-'+room);state.peer.on('open',()=>{$('onlineStatus').textContent='Room ready. Share ID '+room});state.peer.on('connection',c=>{state.connection=c;setMode('online');c.on('data',data=>{if(data.type==='move'){state.chess.move(data.move);state.lastMove={from:data.move.from,to:data.move.to};render()}})})});bind('joinRoomBtn',()=>{if(typeof Peer==='undefined'){$('onlineStatus').textContent='Online library could not load.';return}const room=$('roomInput').value.replace(/\D/g,'');if(room.length!==14){$('onlineStatus').textContent='Enter a 14-digit room ID.';return}state.peer=new Peer();state.connection=state.peer.connect('chess-'+room);state.connection.on('open',()=>{setMode('online');$('onlineStatus').textContent='Connected to room '+room});state.connection.on('data',data=>{if(data.type==='move'){state.chess.move(data.move);state.lastMove={from:data.move.from,to:data.move.to};render()}})});applyProfile();render();
</script>

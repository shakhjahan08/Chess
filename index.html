<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Royal Online Chess</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg: #161512;
      --panel: #262421;
      --panel-border: #363431;
      --text: #bababa;
      
      /* Default Theme: Green */
      --light-square: #ebedd0;
      --dark-square: #779952;
      
      --highlight: rgba(255, 255, 0, 0.4);
      --last-move: rgba(155, 199, 0, 0.41);
      --green-btn: #81b64c;
      --green-btn-hover: #a3d168;
    }

    /* Board Styles */
    body[data-theme="green"] { --light-square: #ebedd0; --dark-square: #779952; }
    body[data-theme="wood"] { --light-square: #f0d9b5; --dark-square: #b58863; }
    body[data-theme="blue"] { --light-square: #dee3e6; --dark-square: #8ca2ad; }
    body[data-theme="glass"] { --light-square: #e0f7fa; --dark-square: #00838f; }
    body[data-theme="neon"] { --light-square: #2a2d32; --dark-square: #00e5ff; }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--bg);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 100%;
      max-width: 1100px;
      padding: 16px;
      display: grid;
      /* Fixed column ratios to prevent board sizing shifts */
      grid-template-columns: minmax(300px, 680px) 340px;
      gap: 24px;
      align-items: start;
    }

    /* Fixed Aspect Ratio Board Wrapper */
    .board-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #000;
      border-radius: 6px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      user-select: none;
      overflow: hidden; /* Prevents piece translation from expanding container */
    }

    .board-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      width: 100%;
      height: 100%;
    }

    .square {
      position: relative;
      border: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .square.light { background-color: var(--light-square); }
    .square.dark { background-color: var(--dark-square); }

    .square.selected::after {
      content: "";
      position: absolute;
      inset: 0;
      background-color: var(--highlight);
    }

    .square.last-move::after {
      content: "";
      position: absolute;
      inset: 0;
      background-color: var(--last-move);
    }

    .square.legal-move::before {
      content: "";
      width: 28%;
      height: 28%;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 50%;
      z-index: 2;
    }

    /* Animated Piece Layer */
    .piece-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .piece {
      position: absolute;
      width: 12.5%;
      height: 12.5%;
      display: grid;
      place-items: center;
      font-size: clamp(2rem, 7.5vw, 4.2rem);
      line-height: 1;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
      transition: transform 0.18s cubic-bezier(0.2, 0, 0.2, 1);
      will-change: transform;
      z-index: 5;
    }

    /* Side Panel */
    .panel {
      background: var(--panel);
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      border: 1px solid var(--panel-border);
      min-width: 0; /* Prevents flex/grid children from expanding width */
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h2 { margin: 0; font-size: 1.4rem; color: #fff; }
    
    .settings-icon-btn {
      background: transparent;
      border: none;
      font-size: 1.3rem;
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
    }

    .settings-icon-btn:hover { background: var(--panel-border); }

    .status-bar {
      background: rgba(0,0,0,0.2);
      padding: 12px;
      border-radius: 6px;
      text-align: center;
      font-weight: 600;
      color: #fff;
      border: 1px solid var(--panel-border);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .room-box {
      background: #191816;
      border: 1px solid var(--panel-border);
      padding: 12px;
      border-radius: 6px;
      text-align: center;
    }

    .room-id {
      font-family: monospace;
      font-size: 2rem;
      letter-spacing: 4px;
      color: #f1c66b;
      margin-top: 4px;
    }

    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; min-width: 0; }

    input, select, button {
      font: inherit;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid var(--panel-border);
      outline: none;
    }

    input, select {
      background: #191816;
      color: #fff;
    }

    input {
      text-align: center;
      font-weight: bold;
      letter-spacing: 2px;
    }

    button {
      cursor: pointer;
      font-weight: bold;
      color: #fff;
      background: #363431;
      transition: background 0.2s;
    }

    button:hover { background: #45433f; }

    button.primary {
      background: var(--green-btn);
      border: 0;
    }

    button.primary:hover { background: var(--green-btn-hover); }

    .player-card {
      background: #191816;
      padding: 10px 14px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--panel-border);
    }

    .turn-indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #45433f;
    }

    .turn-indicator.active { background: #81b64c; box-shadow: 0 0 8px #81b64c; }

    /* Modal / Settings Overlay */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      width: 90%;
      max-width: 380px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-group label {
      font-size: 0.85rem;
      color: var(--text);
    }

    @media (max-width: 800px) {
      .app { grid-template-columns: 1fr; padding: 10px; }
    }
  </style>
</head>
<body data-theme="green">

<main class="app">
  <div class="board-container">
    <div id="boardGrid" class="board-grid"></div>
    <div id="pieceLayer" class="piece-layer"></div>
  </div>

  <aside class="panel">
    <div class="panel-header">
      <h2>♟️ Royal Chess</h2>
      <button id="openSettingsBtn" class="settings-icon-btn" title="Settings">⚙️</button>
    </div>

    <div id="status" class="status-bar">Create or Join a Room</div>

    <div class="room-box">
      <span style="font-size: 0.8rem; color: var(--text);">ONLINE ROOM ID</span>
      <div id="roomDisplay" class="room-id">------</div>
    </div>

    <div class="row">
      <input id="roomInput" inputmode="numeric" maxlength="6" placeholder="6-Digit ID">
      <button id="joinBtn">Join</button>
    </div>

    <button id="createBtn" class="primary">Create 6-Digit Room</button>
    <button id="leaveBtn" style="opacity: 0.7;">Leave Room</button>

    <div class="player-card">
      <div>
        <small style="color: var(--text); display: block;" id="myRoleLabel">YOU</small>
        <strong id="myName">Player 1</strong> <span id="mySide" style="color: var(--text); font-size: 0.85rem;"></span>
      </div>
      <div id="myTurnDot" class="turn-indicator"></div>
    </div>

    <div class="player-card">
      <div>
        <small style="color: var(--text); display: block;">OPPONENT</small>
        <strong id="oppName">Waiting...</strong> <span id="oppSide" style="color: var(--text); font-size: 0.85rem;"></span>
      </div>
      <div id="oppTurnDot" class="turn-indicator"></div>
    </div>
  </aside>
</main>

<!-- Settings Modal -->
<div id="settingsModal" class="modal-overlay">
  <div class="modal">
    <h3>⚙️ Settings</h3>
    
    <div class="field-group">
      <label for="nameInput">Your Display Name</label>
      <input id="nameInput" type="text" maxlength="15" value="Player 1" style="text-align: left;">
    </div>

    <div class="field-group">
      <label for="themeSelect">Board Style (5 Styles)</label>
      <select id="themeSelect">
        <option value="green">🟢 Chess.com Green</option>
        <option value="wood">🪵 Classic Wood</option>
        <option value="blue">🟦 Tournament Blue</option>
        <option value="glass">🧊 Ice Glass</option>
        <option value="neon">⚡ Cyber Neon</option>
      </select>
    </div>

    <button id="closeSettingsBtn" class="primary">Save & Close</button>
  </div>
</div>

<script>
(() => {
  'use strict';

  const $ = id => document.getElementById(id);
  const files = 'abcdefgh';
  const symbols = {
    w: { p: '♙', r: '♖', n: '♘', b: '♗', q: '♕', k: '♔' },
    b: { p: '♟', r: '♜', n: '♞', b: '♝', q: '♛', k: '♚' }
  };

  const state = {
    chess: new Chess(),
    peer: null,
    conn: null,
    room: null,
    host: false,
    color: null,
    selected: null,
    lastMove: null,
    name: 'Player 1',
    opponentName: 'Waiting...'
  };

  // Web Audio Synth for Sounds
  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playSound(type) {
    try {
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'move') {
        osc.frequency.setValueAtTime(320, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
        osc.start(); osc.stop(audioCtx.currentTime + 0.08);
      } else if (type === 'capture') {
        osc.frequency.setValueAtTime(180, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
        osc.start(); osc.stop(audioCtx.currentTime + 0.12);
      }
    } catch(e) {}
  }

  const opposite = c => c === 'w' ? 'b' : 'w';

  function renderBoardSquares() {
    const grid = $('boardGrid');
    grid.innerHTML = '';
    const isBlack = state.color === 'b';
    const rows = isBlack ? [0,1,2,3,4,5,6,7] : [7,6,5,4,3,2,1,0];
    const cols = isBlack ? [7,6,5,4,3,2,1,0] : [0,1,2,3,4,5,6,7];

    rows.forEach(r => {
      cols.forEach(c => {
        const sq = files[c] + (r + 1);
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `square ${(r + c) % 2 === 0 ? 'dark' : 'light'}`;
        btn.dataset.sq = sq;

        if (state.selected === sq) btn.classList.add('selected');
        if (state.lastMove && (state.lastMove.from === sq || state.lastMove.to === sq)) {
          btn.classList.add('last-move');
        }

        if (state.selected && state.chess.moves({ square: state.selected, verbose: true }).some(m => m.to === sq)) {
          btn.classList.add('legal-move');
        }

        btn.onclick = () => onSquareClick(sq);
        grid.appendChild(btn);
      });
    });
  }

  function renderPieces() {
    const layer = $('pieceLayer');
    layer.innerHTML = '';
    const board = state.chess.board();
    const isBlack = state.color === 'b';

    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        const piece = board[r][c];
        if (!piece) continue;

        const el = document.createElement('div');
        el.className = 'piece';
        el.textContent = symbols[piece.color][piece.type];

        const displayCol = isBlack ? 7 - c : c;
        const displayRow = isBlack ? r : 7 - r;

        el.style.transform = `translate(${displayCol * 100}%, ${displayRow * 100}%)`;
        layer.appendChild(el);
      }
    }
  }

  function updateUI() {
    renderBoardSquares();
    renderPieces();

    $('roomDisplay').textContent = state.room \vert{}\vert{} '------';$('myName').textContent = state.name;
    $('oppName').textContent = state.opponentName;

    $('mySide').textContent = state.color ? `(${state.color === 'w' ? 'White' : 'Black'})` : '';
    $('oppSide').textContent = state.color ? `(${state.color === 'w' ? 'Black' : 'White'})` : '';

    const myTurn = state.color && state.chess.turn() === state.color;
    $('myTurnDot').className = `turn-indicator ${myTurn ? 'active' : ''}`;
    $('oppTurnDot').className = `turn-indicator ${state.color && !myTurn ? 'active' : ''}`;

    if (!state.conn) $('status').textContent = 'Create or Join a Room';
    else if (!state.color) $('status').textContent = 'Connecting with opponent...';
    else if (state.chess.is_checkmate()) $('status').textContent = 'Checkmate!';
    else if (state.chess.is_draw()) $('status').textContent = 'Draw!';
    else $('status').textContent = myTurn ? 'Your Turn' : "Opponent's Turn";
  }

  function executeMove(moveObj, emit = false) {
    const captured = state.chess.get(moveObj.to);
    const result = state.chess.move(moveObj);
    if (!result) return false;

    state.lastMove = { from: result.from, to: result.to };
    playSound(captured ? 'capture' : 'move');

    if (emit && state.conn?.open) {
      state.conn.send({ type: 'move', move: moveObj });
    }

    state.selected = null;
    updateUI();
    return true;
  }

  function onSquareClick(sq) {
    initAudio();
    if (!state.conn?.open || !state.color || state.chess.turn() !== state.color || state.chess.game_over()) return;

    const piece = state.chess.get(sq);

    if (state.selected) {
      const legal = state.chess.moves({ square: state.selected, verbose: true }).find(m => m.to === sq);
      if (legal) {
        executeMove({ from: state.selected, to: sq, promotion: 'q' }, true);
        return;
      }
      state.selected = piece?.color === state.color ? sq : null;
    } else if (piece?.color === state.color) {
      state.selected = sq;
    }
    updateUI();
  }

  function sendProfile() {
    if (state.conn?.open) {
      state.conn.send({ type: 'profile', name: state.name });
    }
  }

  function connectToPeer(connection) {
    state.conn = connection;

    connection.on('open', () => {
      sendProfile();
      if (state.host) {
        state.conn.send({ type: 'init', color: opposite(state.color) });
      }
      updateUI();
    });

    connection.on('data', data => {
      if (data.type === 'profile') {
        state.opponentName = data.name || 'Opponent';
        updateUI();
      } else if (data.type === 'init' && !state.host) {
        state.color = data.color;
        state.chess.reset();
        updateUI();
      } else if (data.type === 'move') {
        executeMove(data.move, false);
      }
    });

    connection.on('close', () => {
      state.conn = null;
      state.opponentName = 'Waiting...';
      $('status').textContent = 'Opponent Disconnected';
      updateUI();
    });
  }

  function startRoom(roomId, isHost) {
    if (state.peer) state.peer.destroy();

    state.room = roomId;
    state.host = isHost;
    state.color = isHost ? (Math.random() < 0.5 ? 'w' : 'b') : null;
    state.chess.reset();
    state.lastMove = null;

    state.peer = new Peer(`royal-chess-${roomId}`);

    state.peer.on('open', () => {
      if (!isHost) {
        const connection = state.peer.connect(`royal-chess-${roomId}`, { reliable: true });
        connectToPeer(connection);
      }
      updateUI();
    });

    if (isHost) {
      state.peer.on('connection', connectToPeer);
    }

    state.peer.on('error', err => {
      alert('Room Connection Error: ' + err.type);
    });
  }

  // Bind Buttons directly once DOM is ready
  window.addEventListener('DOMContentLoaded', () => {
    $('createBtn').addEventListener('click', () => {
      const code = Math.floor(100000 + Math.random() * 900000).toString();
      startRoom(code, true);
    });

    $('joinBtn').addEventListener('click', () => {
      const code = $('roomInput').value.trim();
      if (code.length !== 6) return alert('Enter a valid 6-digit Room ID');
      startRoom(code, false);
    });

    $('leaveBtn').addEventListener('click', () => {
      if (state.peer) state.peer.destroy();
      state.conn = null;
      state.room = null;
      state.color = null;
      state.opponentName = 'Waiting...';
      state.chess.reset();
      updateUI();
    });

    $('openSettingsBtn').addEventListener('click', () => {$('settingsModal').classList.add('open');
    });

    $('closeSettingsBtn').addEventListener('click', () => {
      const newName = $('nameInput').value.trim();
      if (newName) {
        state.name = newName;
        sendProfile();
      }
      document.body.setAttribute('data-theme', $('themeSelect').value);$('settingsModal').classList.remove('open');
      updateUI();
    });

    updateUI();
  });
})();
</script>
  
          
</body>
</html>
